name: Python Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-and-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile challenge programs
        run: |
          python -m py_compile software/open_challenge/open_challenge.py
          python -m py_compile software/obstacle_challenge/obstacle_challenge.py
          python -m py_compile engineering/simulation/parameter_sweep.py
      - name: Run analytical model unit tests
        run: python -m unittest discover -s tests -v
      - name: Run analytical parameter sweep
        working-directory: engineering/simulation
        run: python parameter_sweep.py
      - name: Upload analytical output
        uses: actions/upload-artifact@v4
        with:
          name: reference-design-sweep
          path: engineering/simulation/reference_design_sweep.csv
