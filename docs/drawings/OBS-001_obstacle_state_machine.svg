<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b78"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1f2933}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#536575}.h{font-size:17px;font-weight:700}.t{font-size:14px}.small{font-size:12px;fill:#536575}.box{fill:#f3f6f8;stroke:#526879;stroke-width:2}.blue{stroke:#315b78;stroke-width:3;fill:none}.red{stroke:#b24b48;stroke-width:3;fill:none}.dim{stroke:#7894a8;stroke-width:1.8;fill:none;stroke-dasharray:6 5}
</style></defs>
<rect x="18" y="18" width="1164" height="764" rx="8" fill="#fff" stroke="#263746" stroke-width="3"/>
<text x="48" y="62" class="title">OBS-001 — Obstacle Challenge state machine</text><text x="50" y="91" class="sub">High-level sequence and safety transition</text>
<line x1="48" y1="110" x2="1152" y2="110" stroke="#9aabb8" stroke-width="1.5"/>

<rect class="box" x="55" y="175" width="185" height="100" rx="12"/><text x="70" y="210" class="h">BOOT / READY</text><text x="70" y="240" class="t">Check S1–S4 and A–C</text><rect class="box" x="280" y="175" width="185" height="100" rx="12"/><text x="295" y="210" class="h">CALIBRATE</text><text x="295" y="240" class="t">Measure gyro drift</text><rect class="box" x="505" y="175" width="185" height="100" rx="12"/><text x="520" y="210" class="h">UNPARK</text><text x="520" y="240" class="t">Reverse and exit lot</text><rect class="box" x="730" y="175" width="185" height="100" rx="12"/><text x="745" y="210" class="h">FIND DIRECTION</text><text x="745" y="240" class="t">Select CW / CCW</text><rect class="box" x="955" y="175" width="185" height="100" rx="12"/><text x="970" y="210" class="h">DRIVE</text><text x="970" y="240" class="t">Maintain lane position</text><rect class="box" x="55" y="380" width="185" height="100" rx="12"/><text x="70" y="415" class="h">AVOID PILLAR</text><text x="70" y="445" class="t">Use Pixy2 signature</text><rect class="box" x="280" y="380" width="185" height="100" rx="12"/><text x="295" y="415" class="h">CORNER TURN</text><text x="295" y="445" class="t">Heading target ±90°</text><rect class="box" x="505" y="380" width="185" height="100" rx="12"/><text x="520" y="415" class="h">APPROACH LOT</text><text x="520" y="445" class="t">Align with parking area</text><rect class="box" x="730" y="380" width="185" height="100" rx="12"/><text x="745" y="415" class="h">PARK</text><text x="745" y="445" class="t">Replay / execute parking</text><rect class="box" x="955" y="380" width="185" height="100" rx="12"/><text x="970" y="415" class="h">FINISHED</text><text x="970" y="445" class="t">Hold motors and log</text>
<path class="blue" marker-end="url(#arr)" d="M240 225 H265"/><path class="blue" marker-end="url(#arr)" d="M465 225 H490"/><path class="blue" marker-end="url(#arr)" d="M690 225 H715"/><path class="blue" marker-end="url(#arr)" d="M915 225 H940"/>
<path class="blue" marker-end="url(#arr)" d="M940 275 V340 H150 V380"/><path class="blue" marker-end="url(#arr)" d="M240 430 H265"/><path class="blue" marker-end="url(#arr)" d="M465 430 H490"/><path class="blue" marker-end="url(#arr)" d="M690 430 H715"/><path class="blue" marker-end="url(#arr)" d="M915 430 H940"/>
<rect x="935" y="575" width="205" height="85" rx="10" fill="#fff4f2" stroke="#b24b48" stroke-width="2.5"/><text x="955" y="610" class="h">SAFETY STOP</text><text x="955" y="637" class="t">Timeout / sensor fault</text><path class="red" marker-end="url(#arr)" d="M1035 480 V570"/>
<text x="65" y="670" class="t">Safety stop may be triggered from any active state. Transition conditions are implemented in software.</text>
<line x1="48" y1="720" x2="1152" y2="720" stroke="#9aabb8" stroke-width="1.5"/>
<text x="50" y="750" class="small">SOFTWARE FLOW REFERENCE • CONFIRM STATE TRANSITIONS AGAINST THE CURRENT PROGRAM</text><text x="1150" y="750" class="small" text-anchor="end">QATAR-FE • TEAM 6038 • REV A</text></svg>