<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><style>.title{font:700 28px Arial;fill:#172b3d}.label{font:18px Arial;fill:#26384a}.small{font:15px Arial;fill:#586879}.dim{font:16px Arial;fill:#8b3d58}.cam{fill:#eef3f8;stroke:#315a7d;stroke-width:3}.ray{stroke:#a34d63;stroke-width:3;fill:none}.ground{stroke:#38766d;stroke-width:3}.axis{stroke:#315a7d;stroke-width:2;stroke-dasharray:8 6}</style></defs>
<rect width="1200" height="760" fill="#fff"/>
<text x="600" y="48" text-anchor="middle" class="title">CAM-001 — Pixy2 Camera Geometry Reference</text>
<text x="600" y="78" text-anchor="middle" class="small">Obstacle Challenge perception • Side-view conceptual geometry</text>
<!-- ground -->
<line x1="100" y1="610" x2="1100" y2="610" class="ground"/>
<text x="1060" y="640" class="label">Ground plane</text>
<!-- vehicle -->
<rect x="170" y="470" width="390" height="95" rx="15" class="cam"/>
<circle cx="250" cy="590" r="35" fill="#293847"/><circle cx="480" cy="590" r="35" fill="#293847"/>
<text x="365" y="520" text-anchor="middle" class="label">Vehicle reference frame</text>
<!-- camera -->
<rect x="500" y="405" width="90" height="55" rx="8" class="cam"/>
<text x="545" y="438" text-anchor="middle" class="label">Pixy2</text>
<line x1="590" y1="432" x2="760" y2="500" class="ray"/>
<path d="M590 432 L950 590 M590 432 L920 610" class="ray"/>
<text x="740" y="470" class="dim">Configured horizontal FOV: 60°</text>
<!-- pillar -->
<rect x="900" y="390" width="70" height="220" rx="8" fill="#f7e8e8" stroke="#a34d63" stroke-width="3"/>
<text x="935" y="370" text-anchor="middle" class="label">Pillar</text>
<!-- offset -->
<line x1="545" y1="650" x2="545" y2="685" class="axis"/>
<line x1="545" y1="670" x2="935" y2="670" class="axis"/>
<text x="740" y="700" text-anchor="middle" class="dim">Configured camera offset: 100 mm (reference definition to be confirmed)</text>
<!-- model box -->
<rect x="120" y="120" width="460" height="205" rx="12" fill="#f4f7fb" stroke="#315a7d" stroke-width="2"/>
<text x="150" y="160" class="label">Configured image-to-range model</text>
<text x="350" y="215" text-anchor="middle" class="title">d = K / (v − v₀)</text>
<text x="150" y="260" class="small">K = 20100 px·mm</text>
<text x="150" y="290" class="small">v₀ = 63 px</text>
<text x="150" y="315" class="small">Image feature v is selected by the program.</text>
<text x="600" y="735" text-anchor="middle" class="small">Reference geometry only. Camera height, pitch, exact optical centre, and physical calibration observations are not specified in this drawing.</text>
</svg>