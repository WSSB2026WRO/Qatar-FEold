<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><style>.title{font:700 28px Arial;fill:#172b3d}.label{font:18px Arial;fill:#26384a}.small{font:15px Arial;fill:#586879}.port{fill:#f1f5f9;stroke:#315a7d;stroke-width:2}.device{fill:#eef7f3;stroke:#38766d;stroke-width:2}.line{stroke:#315a7d;stroke-width:3;fill:none}</style></defs>
<rect width="1200" height="760" fill="#fff"/>
<text x="600" y="48" text-anchor="middle" class="title">ELE-001 — EV3 Wiring and Port Allocation</text>
<text x="600" y="78" text-anchor="middle" class="small">Functional interface map based on the documented vehicle configuration</text>
<rect x="440" y="135" width="320" height="500" rx="22" fill="#f4f7fb" stroke="#315a7d" stroke-width="4"/>
<text x="600" y="180" text-anchor="middle" class="title">LEGO EV3</text>
<text x="600" y="210" text-anchor="middle" class="small">Programmable controller</text>
<!-- motor ports -->
<text x="480" y="260" class="label">OUTPUT PORTS</text>
{["A","B","C","D"].map((p,i)=>"").join("")}
<rect x="475" y="280" width="95" height="48" rx="8" class="port"/><text x="522" y="311" text-anchor="middle" class="label">A</text>
<rect x="630" y="280" width="95" height="48" rx="8" class="port"/><text x="677" y="311" text-anchor="middle" class="label">B</text>
<rect x="475" y="350" width="95" height="48" rx="8" class="port"/><text x="522" y="381" text-anchor="middle" class="label">C</text>
<rect x="630" y="350" width="95" height="48" rx="8" class="port"/><text x="677" y="381" text-anchor="middle" class="label">D</text>
<text x="480" y="440" class="label">INPUT PORTS</text>
{["1","2","3","4"].map((p,i)=>"").join("")}
<rect x="475" y="460" width="95" height="48" rx="8" class="port"/><text x="522" y="491" text-anchor="middle" class="label">S1</text>
<rect x="630" y="460" width="95" height="48" rx="8" class="port"/><text x="677" y="491" text-anchor="middle" class="label">S2</text>
<rect x="475" y="530" width="95" height="48" rx="8" class="port"/><text x="522" y="561" text-anchor="middle" class="label">S3</text>
<rect x="630" y="530" width="95" height="48" rx="8" class="port"/><text x="677" y="561" text-anchor="middle" class="label">S4</text>
<!-- left device labels -->
<rect x="65" y="275" width="270" height="60" rx="10" class="device"/><text x="200" y="312" text-anchor="middle" class="label">Medium motor — drive</text>
<rect x="65" y="345" width="270" height="60" rx="10" class="device"/><text x="200" y="382" text-anchor="middle" class="label">Medium motor — steering</text>
<rect x="65" y="455" width="270" height="60" rx="10" class="device"/><text x="200" y="492" text-anchor="middle" class="label">Gyro — heading</text>
<rect x="65" y="525" width="270" height="60" rx="10" class="device"/><text x="200" y="562" text-anchor="middle" class="label">Ultrasonic — right side</text>
<!-- right -->
<rect x="865" y="275" width="270" height="60" rx="10" class="device"/><text x="1000" y="312" text-anchor="middle" class="label">Medium motor — drive</text>
<rect x="865" y="345" width="270" height="60" rx="10" class="device"/><text x="1000" y="382" text-anchor="middle" class="label">Front LED lamp</text>
<rect x="865" y="455" width="270" height="60" rx="10" class="device"/><text x="1000" y="492" text-anchor="middle" class="label">Ultrasonic — left side</text>
<rect x="865" y="525" width="270" height="60" rx="10" class="device"/><text x="1000" y="562" text-anchor="middle" class="label">Pixy2 — I²C camera</text>
<!-- connectors -->
<path d="M335 305 H430 L475 305 M335 375 H430 L475 375 M570 484 H630 M570 554 H630" class="line"/>
<path d="M725 305 H820 L865 305 M725 375 H820 L865 375 M725 484 H820 L865 484 M725 554 H865" class="line"/>
<text x="600" y="680" text-anchor="middle" class="small">A: left drive • B: right drive • C: steering • D: front illumination • S1: gyro • S2: left ultrasonic • S3: right ultrasonic • S4: Pixy2 I²C</text>
<text x="600" y="710" text-anchor="middle" class="small">Verify the physical cable routing and connector condition on the assembled robot before electrical troubleshooting.</text>
</svg>