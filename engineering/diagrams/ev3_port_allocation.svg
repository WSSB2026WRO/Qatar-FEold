<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><style>.title{font:700 28px Arial;fill:#172b3d}.label{font:18px Arial;fill:#26384a}.small{font:15px Arial;fill:#586879}.port{fill:#f1f5f9;stroke:#315a7d;stroke-width:2}.device{fill:#eef7f3;stroke:#38766d;stroke-width:2}.line{stroke:#315a7d;stroke-width:3;fill:none}</style></defs>
<rect width="1200" height="760" fill="#fff"/>
<text x="600" y="48" text-anchor="middle" class="title">ELE-001 — EV3 Wiring and Port Allocation</text>
<text x="600" y="78" text-anchor="middle" class="small">Functional interface map based on the documented vehicle configuration</text>
<rect x="440" y="130" width="320" height="520" rx="22" fill="#f4f7fb" stroke="#315a7d" stroke-width="4"/>
<text x="600" y="175" text-anchor="middle" class="title">LEGO EV3</text>
<text x="600" y="205" text-anchor="middle" class="small">Programmable controller</text>
<text x="480" y="250" class="label">MOTOR OUTPUTS</text>
<rect x="475" y="270" width="95" height="48" rx="8" class="port"/><text x="522" y="301" text-anchor="middle" class="label">A</text>
<rect x="630" y="270" width="95" height="48" rx="8" class="port"/><text x="677" y="301" text-anchor="middle" class="label">B</text>
<rect x="475" y="340" width="95" height="48" rx="8" class="port"/><text x="522" y="371" text-anchor="middle" class="label">C</text>
<rect x="630" y="340" width="95" height="48" rx="8" class="port"/><text x="677" y="371" text-anchor="middle" class="label">D</text>
<text x="480" y="435" class="label">SENSOR INPUTS</text>
<rect x="475" y="455" width="95" height="48" rx="8" class="port"/><text x="522" y="486" text-anchor="middle" class="label">S1</text>
<rect x="630" y="455" width="95" height="48" rx="8" class="port"/><text x="677" y="486" text-anchor="middle" class="label">S2</text>
<rect x="475" y="525" width="95" height="48" rx="8" class="port"/><text x="522" y="556" text-anchor="middle" class="label">S3</text>
<rect x="630" y="525" width="95" height="48" rx="8" class="port"/><text x="677" y="556" text-anchor="middle" class="label">S4</text>
<rect x="65" y="265" width="270" height="60" rx="10" class="device"/><text x="200" y="302" text-anchor="middle" class="label">Medium motor — drive motor A</text>
<rect x="865" y="265" width="270" height="60" rx="10" class="device"/><text x="1000" y="302" text-anchor="middle" class="label">Medium motor — drive motor B</text>
<rect x="65" y="335" width="270" height="60" rx="10" class="device"/><text x="200" y="372" text-anchor="middle" class="label">Medium motor — steering</text>
<rect x="865" y="335" width="270" height="60" rx="10" class="device"/><text x="1000" y="372" text-anchor="middle" class="label">No device assigned</text>
<rect x="65" y="450" width="270" height="60" rx="10" class="device"/><text x="200" y="487" text-anchor="middle" class="label">Gyro — heading</text>
<rect x="865" y="450" width="270" height="60" rx="10" class="device"/><text x="1000" y="487" text-anchor="middle" class="label">Ultrasonic — left side</text>
<rect x="65" y="520" width="270" height="60" rx="10" class="device"/><text x="200" y="557" text-anchor="middle" class="label">Ultrasonic — right side</text>
<rect x="865" y="520" width="270" height="60" rx="10" class="device"/><text x="1000" y="557" text-anchor="middle" class="label">Pixy2 — I²C camera + integrated light</text>
<path d="M335 295 H405 L475 294 M725 294 H795 L865 295 M335 365 H405 L475 364 M725 364 H795 L865 365 M335 480 H405 L475 479 M725 479 H795 L865 480 M335 550 H405 L475 549 M725 549 H865" class="line"/>
<text x="600" y="690" text-anchor="middle" class="small">A/B: drive motors • C: steering • D: unused</text>
<text x="600" y="718" text-anchor="middle" class="small">S1: gyro • S2: left ultrasonic • S3: right ultrasonic • S4: Pixy2 I²C + integrated illumination</text>
<text x="600" y="742" text-anchor="middle" class="small">Pixy2 illumination is part of the S4 camera assembly; no separate device is assigned to port D.</text>
</svg>