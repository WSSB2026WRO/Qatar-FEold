<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<defs>
<style>
.title{font:700 28px Arial;fill:#172b3d}.sub{font:700 19px Arial;fill:#315a7d}.label{font:17px Arial;fill:#26384a}.dim{font:16px Arial;fill:#8b3d58}.note{font:15px Arial;fill:#586879}.chassis{fill:#eef3f8;stroke:#315a7d;stroke-width:3}.component{fill:#fff;stroke:#38766d;stroke-width:2}.wheel{fill:#293847;stroke:#15283d;stroke-width:2}.line{stroke:#8b3d58;stroke-width:2;fill:none}.center{stroke:#8b9bab;stroke-width:1.5;stroke-dasharray:7 6}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#8b3d58"/></marker>
</defs>
<rect width="1200" height="820" fill="#fff"/>
<text x="600" y="42" text-anchor="middle" class="title">MEC-001 — Chassis and Component Layout Reference</text>
<text x="600" y="72" text-anchor="middle" class="note">Preliminary packaging schematic • Top view • Not to scale</text>
<!-- chassis -->
<rect x="390" y="145" width="420" height="520" rx="18" class="chassis"/>
<line x1="600" y1="125" x2="600" y2="685" class="center"/>
<text x="600" y="125" text-anchor="middle" class="note">Vehicle longitudinal centreline</text>
<!-- front -->
<text x="600" y="105" text-anchor="middle" class="sub">FRONT</text>
<!-- front wheels -->
<rect x="345" y="185" width="40" height="115" rx="7" class="wheel"/>
<rect x="815" y="185" width="40" height="115" rx="7" class="wheel"/>
<!-- rear wheels -->
<rect x="345" y="535" width="40" height="115" rx="7" class="wheel"/>
<rect x="815" y="535" width="40" height="115" rx="7" class="wheel"/>
<!-- components -->
<rect x="475" y="215" width="250" height="75" rx="8" class="component"/>
<text x="600" y="245" text-anchor="middle" class="label">Front steering</text><text x="600" y="268" text-anchor="middle" class="note">Actuator / linkage zone</text>
<rect x="470" y="345" width="260" height="125" rx="8" class="component"/>
<text x="600" y="395" text-anchor="middle" class="sub">EV3 controller</text><text x="600" y="423" text-anchor="middle" class="note">Controller envelope reference</text>
<rect x="500" y="505" width="200" height="65" rx="8" class="component"/>
<text x="600" y="544" text-anchor="middle" class="label">Battery / power zone</text>
<text x="600" y="625" text-anchor="middle" class="note">Rear drive assembly</text>
<!-- camera -->
<rect x="565" y="150" width="70" height="38" rx="5" fill="#fff3e5" stroke="#a46b2a" stroke-width="2"/>
<text x="600" y="174" text-anchor="middle" class="note">Pixy2</text>
<path d="M600 148 V100" class="line" marker-end="url(#arrow)"/>
<!-- dimensions -->
<line x1="390" y1="710" x2="810" y2="710" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="390" y1="675" x2="390" y2="725" class="line"/><line x1="810" y1="675" x2="810" y2="725" class="line"/>
<text x="600" y="740" text-anchor="middle" class="dim">Documented overall width: 110 mm</text>
<line x1="880" y1="145" x2="880" y2="665" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="825" y1="145" x2="900" y2="145" class="line"/><line x1="825" y1="665" x2="900" y2="665" class="line"/>
<text x="910" y="410" class="dim" transform="rotate(90 910 410)" text-anchor="middle">Documented overall length: 180 mm (envelope value to be confirmed against CAD)</text>
<text x="600" y="780" text-anchor="middle" class="note">Wheelbase 100 mm • Front track 100 mm • Overall height 210 mm (side-view envelope)</text>
<text x="600" y="802" text-anchor="middle" class="note">Component blocks indicate functional zones only; exact positions and mounting coordinates are not defined here.</text>
</svg>