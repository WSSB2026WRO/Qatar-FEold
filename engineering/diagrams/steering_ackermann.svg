<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs><style>.title{font:700 30px Arial;fill:#162b40}.label{font:21px Arial;fill:#26384a}.small{font:17px Arial;fill:#526477}.ch{fill:#eef3f8;stroke:#315a7d;stroke-width:4}.wheel{fill:#26384a;stroke:#162b40;stroke-width:2}.link{stroke:#a34d63;stroke-width:7;fill:none}.guide{stroke:#7891a8;stroke-width:2;stroke-dasharray:8 7}</style></defs>
<rect width="1200" height="720" fill="white"/>
<text x="600" y="55" text-anchor="middle" class="title">Conceptual Ackermann Steering Geometry</text>
<rect x="390" y="210" width="420" height="300" rx="30" class="ch"/>
<rect x="350" y="235" width="55" height="145" rx="12" class="wheel" transform="rotate(-18 377 307)"/>
<rect x="795" y="235" width="55" height="145" rx="12" class="wheel" transform="rotate(-8 822 307)"/>
<rect x="350" y="425" width="55" height="145" rx="12" class="wheel"/>
<rect x="795" y="425" width="55" height="145" rx="12" class="wheel"/>
<path d="M405 315 L795 270" class="link"/>
<path d="M405 315 L600 340 L795 270" class="link"/>
<path d="M377 305 L570 625 L822 305" class="guide"/>
<circle cx="570" cy="625" r="9" fill="#a34d63"/>
<text x="600" y="145" text-anchor="middle" class="label">Front axle — inner wheel angle δᵢ exceeds outer angle δₒ</text>
<text x="600" y="655" text-anchor="middle" class="label">Ideal condition: cot(δₒ) − cot(δᵢ) = T / L</text>
